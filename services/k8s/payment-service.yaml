apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payment-service
          image: payment-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 4001
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          env:
            - name: PG_HOST
              value: postgres
            - name: PG_USER
              value: sentinel
            - name: PG_PASSWORD
              value: sentinel
            - name: PG_DATABASE
              value: sentinelops
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 4001
      targetPort: 4001
